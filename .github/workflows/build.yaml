name: Build and Test

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
    branches: [main, beta]

jobs:
  test:
    name: Test Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: blackout-notify/src/go.mod
          cache-dependency-path: blackout-notify/src/go.sum

      - name: Download dependencies
        working-directory: blackout-notify/src
        run: go mod download

      - name: Run tests
        working-directory: blackout-notify/src
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build
        working-directory: blackout-notify/src
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o ../bin/blackout-notify ./cmd/bot

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: blackout-notify/src/go.mod
          cache-dependency-path: blackout-notify/src/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: blackout-notify/src

  build-addon:
    name: Build Add-on Image
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64, armv7]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "version:" blackout-notify/config.yaml | awk '{print $2}' | tr -d '"')
          BUILD_FROM=$(grep "^  ${{ matrix.arch }}:" blackout-notify/build.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_from=$BUILD_FROM" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./blackout-notify
          file: ./blackout-notify/Dockerfile
          platforms: linux/${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch == 'armv7' && 'arm/v7' || 'amd64' }}
          push: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            BUILD_FROM=${{ steps.version.outputs.build_from }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ha-blackout-notify-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ha-blackout-notify-${{ matrix.arch }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

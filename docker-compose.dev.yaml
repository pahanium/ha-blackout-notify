# Local development: runs the bot from Dockerfile.dev (no s6-overlay/bashio)
# with settings from .env. Use `make dev-up`.

services:
  blackout-notify:
    build:
      context: ./blackout-notify
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      # Keep statistics across rebuilds (overrides STATS_DB_PATH from .env)
      STATS_DB_PATH: /data/power_stats.db
    volumes:
      - ./.data:/data
    # No auto-restart: a config error should stop the container, not loop
    restart: "no"
